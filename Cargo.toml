[workspace]
resolver = "2"
members = ["crates/clawpit-scene", "crates/clawpit", "crates/clawpit-tui"]

[workspace.package]
version = "0.6.0"
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "像素风本地 agent 车间：发现、指挥、对话你机器上的 AI 编码 agent"

[workspace.dependencies]
clawpit-scene = { path = "crates/clawpit-scene" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.28"
crossterm = "0.28"
futures-util = "0.3"
tokio-tungstenite = "0.23"
portable-pty = "0.8"
tempfile = "3"
