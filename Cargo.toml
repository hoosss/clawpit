[workspace]
resolver = "2"
members = ["crates/pf-scene", "crates/pf-hub", "crates/pf-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
readme = "README.md"

[workspace.dependencies]
pf-scene = { path = "crates/pf-scene" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.28"
crossterm = "0.28"
futures-util = "0.3"
tokio-tungstenite = "0.23"
portable-pty = "0.8"
tempfile = "3"
