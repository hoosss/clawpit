<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>clawpit · 车间</title>
<style>
  html,body{margin:0;height:100%;background:#1a1c2c;color:#e8e8e8;
    font-family:"Courier New",ui-monospace,monospace;overflow:hidden;user-select:none}
  #app{display:flex;height:100%}
  #stage{flex:1;position:relative;min-width:0;background:#1a1c2c}
  #cv{width:100%;height:100%;display:block;cursor:crosshair}
  text{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,"Courier New",monospace}
  .worker{cursor:pointer}
  .worker:hover{filter:brightness(1.18)}
  #side{width:264px;background:#12131f;border-left:2px solid #2a2c3f;display:flex;flex-direction:column;font-size:12px}
  #hdr{padding:10px 12px;border-bottom:2px solid #2a2c3f;letter-spacing:1px;color:#f7d51d}
  #agents{flex:1 1 38%;overflow-y:auto;padding:6px}
  .agent{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:3px;cursor:pointer}
  .agent:hover{background:#1c1e30}
  .agent.sel{background:#26294a;outline:1px solid #f7d51d}
  .chip{width:12px;height:12px;border-radius:2px;flex:none}
  .acol{flex:1;min-width:0;display:flex;flex-direction:column}
  .aname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .astate{color:#9aa;font-size:11px}
  .atitle{color:#8890b0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chat{flex:1 1 34%;overflow-y:auto;padding:6px;border-top:2px solid #2a2c3f;line-height:1.5}
  .m{word-break:break-all}
  .m b{color:#7ee}
  #ctrl{padding:8px;border-top:2px solid #2a2c3f;display:flex;flex-direction:column;gap:6px}
  #msg{background:#0c0d17;border:1px solid #2a2c3f;color:#eee;padding:7px;border-radius:3px;font:inherit}
  #msg:focus{outline:1px solid #f7d51d}
  .btns{display:flex;gap:6px}
  button{flex:1;background:#26294a;border:1px solid #3a3d5f;color:#e8e8e8;padding:6px;border-radius:3px;
    font:inherit;cursor:pointer}
  button:hover{background:#31355c}
  #b-stop:hover{background:#5c2333}
  #status{padding:6px 10px;color:#9aa;font-size:11px;border-top:1px solid #2a2c3f}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="floor" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#1e2035"/>
          <rect width="8" height="8" fill="#20223a"/>
          <rect x="8" y="8" width="8" height="8" fill="#20223a"/>
        </pattern>
      </defs>
      <rect id="wall" width="100%" height="30" fill="#171928"/>
      <text id="sign" x="8" y="13" font-size="9" letter-spacing="1" fill="#f7d51d">CLAWPIT PIT CREW</text>
      <text id="live" x="0" y="13" font-size="9" text-anchor="end" fill="#5a5">● live</text>
      <rect id="floorrect" y="30" width="100%" height="100%" fill="url(#floor)"/>
      <!-- floorrect 高度 100% 会越过 viewBox 底边，被视口裁掉——正好铺满，无需精确高度 -->
      <g id="workers"></g>
      <g id="bubbles"></g>
    </svg>
  </div>
  <div id="side">
    <div id="hdr">▶ clawpit 车间</div>
    <div id="agents"></div>
    <div id="chat"></div>
    <div id="ctrl">
      <input id="msg" placeholder="对选中 worker 说话（回车发送）"/>
      <div class="btns">
        <button id="b-send">说话</button>
        <button id="b-spawn">招工</button>
        <button id="b-stop">解雇</button>
      </div>
    </div>
    <div id="status">connecting…</div>
  </div>
</div>
<script>
'use strict';
// ── 场景模型（与 clawpit-scene 协议一致） ─────────────────────────────
const PROVIDER_COLORS = {
  claude_code:'#e06be0', codex:'#6be06b', gemini:'#6b9fe0',
  aider:'#e06b6b', opencode:'#e0c96b', generic:'#9aa0b0'
};
const STATE_TEXT = {
  unknown:'？', thinking:'想', working:'干', waiting_input:'等', done:'完', error:'错'
};
let agents = [];          // [{id,provider,name,state,source}]
let messages = [];        // [{id,from,from_name,to,text,ts}]
let selected = null;
let connected = false;

// ── WS：同一场景协议 ───────────────────────────────────────────
let ws, retry = 1000;
function connect(){
  setStatus('connecting…');
  // file:// 直开时 location.host 为空会同步抛异常，砸断渲染循环——兜住走重连提示
  if (!location.host){ setStatus('请通过 hub 访问（http://localhost:7664）'); return; }
  try { ws = new WebSocket(`ws://${location.host}/scene`); }
  catch (e){ setStatus('WS 连接失败：' + e.message); setTimeout(connect, 5000); return; }
  ws.onopen = () => { connected = true; retry = 1000; setStatus('connected'); };
  ws.onclose = () => { connected = false; setTimeout(connect, retry); retry = Math.min(retry*2, 8000); setStatus('reconnecting…'); };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'snapshot'){
      agents = ev.agents;
      // 快照是全量替换：选中项若已消失必须失效，否则悬空 id 会打到 400
      if (selected && !agents.some(a => a.id === selected)) selected = null;
    }
    else if (ev.type === 'agent_upsert'){
      const i = agents.findIndex(a => a.id === ev.agent.id);
      i >= 0 ? agents[i] = ev.agent : agents.push(ev.agent);
      agents.sort((a,b) => a.id < b.id ? -1 : 1);
    }
    else if (ev.type === 'agent_gone'){
      agents = agents.filter(a => a.id !== ev.id);
      if (selected === ev.id) selected = null;
    }
    else if (ev.type === 'chat'){ ev.message.ts = Date.now(); messages.push(ev.message); trimChat(); }
    // chat 不动工人 DOM（重建会打断 :hover），只有名单变化才重建
    ev.type === 'chat' ? renderList() : rebuildWorkers();
  };
}
function setStatus(s){ document.getElementById('status').textContent = s; }
function send(cm){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(cm)); }

// ── 侧栏 ──────────────────────────────────────────────────────
function renderList(){
  const box = document.getElementById('agents');
  box.innerHTML = '';
  if (!agents.length){
    box.innerHTML = '<div style="padding:10px;color:#667">车间空无一人。<br>点「招工」或在终端里跑一个 claude。</div>';
    return;
  }
  for (const a of agents){
    const d = document.createElement('div');
    d.className = 'agent' + (a.id === selected ? ' sel' : '');
    d.innerHTML = `<span class="chip" style="background:${PROVIDER_COLORS[a.provider]||'#888'}"></span>
      <span class="acol"><span class="aname">${esc(a.name)}</span><span class="astate">${STATE_TEXT[a.state]||esc(a.state)}</span>${a.title ? `<span class="atitle">${esc(a.title)}</span>` : ''}</span>`;
    d.onclick = () => { selected = a.id; renderList(); };
    box.appendChild(d);
  }
}
function trimChat(){
  // 全量重建（不是增量 append——旧实现每条消息重复 append，同一条最多显示 8 次）
  const box = document.getElementById('chat');
  box.innerHTML = '';
  for (const m of messages.slice(-40)){
    const d = document.createElement('div');
    d.className = 'm';
    d.innerHTML = `<b>${esc(m.from_name)}</b>→${esc(m.to==='human'?'你':m.to)}: ${esc(m.text)}`;
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}
function esc(s){ const d=document.createElement('span'); d.textContent=s??''; return d.innerHTML; }

// ── 控制 ──────────────────────────────────────────────────────
async function api(method, path, body){
  // 5s 超时：hub 偶发阻塞时用户至少能看到失败提示，而不是输入框永久 pending
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch(path, {method, headers:{'content-type':'application/json'},
      body: body ? JSON.stringify(body) : undefined, signal: ctl.signal});
    if (!r.ok) throw new Error((await r.text()) || r.statusText);
    return r.json();
  } finally { clearTimeout(timer); }
}
async function speak(){
  const el = document.getElementById('msg');
  const text = el.value.trim();
  if (!text) return;
  if (!selected){ setStatus('先在列表或画布上选中一只 worker'); return; }
  try {
    // 走邮局：能注入的直接注入，不能的进收件箱；同时气泡上墙
    const r = await api('POST', '/msg', {from_pid: null, to: selected, text});
    el.value = '';
    // 投递去向如实相告：收件箱是死信候选（对方不在 tmux 且未配 MCP 就永远看不到）
    if (r.delivered === 'inbox')
      setStatus(`⚠ 只进了 ${selected} 的收件箱——它不在 tmux 也没配 clawpit MCP，收不到。让它跑在 tmux 里，或用「招工」直管`);
    else if (r.delivered === 'wall')
      setStatus('已上墙');
    else
      setStatus(`✓ 已注入 ${selected}（${r.delivered === 'injected_stdin' ? 'stdin' : 'tmux'}）`);
  } catch(e){ setStatus('发送失败：' + e.message); }
}
document.getElementById('b-send').onclick = speak;
document.getElementById('msg').addEventListener('keydown', e => { if (e.key==='Enter') speak(); });
document.getElementById('b-spawn').onclick = () =>
  api('POST', '/agents', {provider:'claude_code'}).catch(e => setStatus('招工失败：'+e.message));
document.getElementById('b-stop').onclick = () => {
  if (!selected) return setStatus('先选中要解雇的 worker');
  api('DELETE', '/agents/' + selected).catch(e => setStatus('解雇失败：'+e.message));
};

// ── SVG 矢量车间（viewBox 场景坐标系，几何渲染任意缩放都锐利） ────────
const svg = document.getElementById('cv'),
      workersG = document.getElementById('workers'),
      bubblesG = document.getElementById('bubbles'),
      liveText = document.getElementById('live');
const SCENE_H = 270;
let sceneW = 480, sceneH = SCENE_H;  // 随容器宽高比动态算，修掉旧 canvas 无脑拉伸的变形
let workerEls = [];      // [{id, g, armL, armR, sel}]

// 视口自适应：常规窗口 = 高 270 单位、宽度贴比例；极窄窗口宽封顶 320 下限、
// 高度相应变长（地板铺满，多出来的就是地板），任何比例都不变形也不 letterbox
function layout(){
  const r = svg.getBoundingClientRect();
  if (r.height < 1 || r.width < 1) return;
  sceneW = Math.max(320, SCENE_H * r.width / r.height);
  sceneH = sceneW * r.height / r.width;
  svg.setAttribute('viewBox', `0 0 ${sceneW} ${sceneH}`);
  liveText.setAttribute('x', sceneW - 8);
}
new ResizeObserver(layout).observe(document.getElementById('stage'));

// 工位布局：横向优先（每行按宽度挤满 72 宽的工位），最多 4 行——
// 窄窗口自动折行，工人再多也画在画布内
function slots(n){
  const out = [];
  if (n === 0) return out;
  const x0 = 20, y0 = 52, dy = 56;
  const perRow = Math.max(1, Math.floor((sceneW - x0 - 20) / 72));
  const rows = Math.min(4, Math.ceil(n / perRow));
  const cols = Math.ceil(n / rows);
  const dx = Math.max(24, Math.min(72, Math.floor((sceneW - x0 - 20) / cols)));
  for (let i = 0; i < n; i++) out.push({x: x0 + (i%cols)*dx, y: y0 + Math.floor(i/cols)*dy});
  return out;
}
function slotOf(id){
  const i = agents.findIndex(a => a.id === id);
  return i < 0 ? null : slots(agents.length)[i];
}

// worker 结构只在名单变化时重建（扫描会周期性推 upsert，重建会打断 :hover）；
// 每帧只动 transform/手臂/选框，不碰 DOM 结构
let workersKey = '';
function rebuildWorkers(){
  renderList();
  const key = agents.map(a => a.id).join(',');
  if (key === workersKey) return;   // 名单没变：状态由 frame() 逐帧读，侧栏已刷新
  workersKey = key;
  workersG.innerHTML = '';
  workerEls = agents.map(a => {
    const c = PROVIDER_COLORS[a.provider] || '#9aa0b0';
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'worker');
    // 像素小人由矢量 rect 拼成：任意缩放边缘锐利，坐标沿用旧 sprite 网格
    g.innerHTML =
      `<rect class="hit" x="-6" y="-14" width="24" height="33" fill="transparent"/>` +
      `<rect class="shadow" x="1" y="15" width="11" height="2" fill="rgba(0,0,0,.4)"/>` +
      `<rect class="legs" x="3" y="11" width="3" height="4" fill="#3a3d5f"/>` +
      `<rect class="legs" x="7" y="11" width="3" height="4" fill="#3a3d5f"/>` +
      `<rect class="body" x="2" y="5" width="9" height="7" fill="${c}"/>` +
      `<rect class="armL" x="0" y="6" width="2" height="5" fill="${c}"/>` +
      `<rect class="armR" x="11" y="6" width="2" height="5" fill="${c}"/>` +
      `<rect class="head" x="3" y="0" width="7" height="5" fill="#f0c8a0"/>` +
      `<rect x="2" y="-2" width="9" height="2" fill="${c}"/>` +
      `<rect x="5" y="-4" width="4" height="2" fill="${c}"/>` +
      `<rect x="4" y="2" width="1.2" height="1.4" fill="#222"/>` +
      `<rect x="8" y="2" width="1.2" height="1.4" fill="#222"/>` +
      `<text class="name" x="-2" y="24" font-size="7" fill="#cfd3ff"></text>` +
      `<text class="st" x="13" y="-2" font-size="7" fill="#ffe"></text>`;
    // 名牌优先显示任务标题（一眼分辨每只小人在干什么），没有才回退 id
    g.querySelector('.name').textContent = (a.title || a.name).slice(0, 12);
    g.addEventListener('click', () => { selected = a.id; renderList(); });
    workersG.appendChild(g);
    return { id: a.id, g,
      armL: g.querySelector('.armL'), armR: g.querySelector('.armR'),
      st: g.querySelector('.st') };
  });
}

const STATE_GLYPH = {working:'!', thinking:'...', waiting_input:'zZ', done:'OK', error:'X!', unknown:'?'};
const STATE_FILL = {error:'#ff6b6b', done:'#6bff8f'};

// 每帧：浮沉/挥臂走亚像素（旧 canvas 版取整，一格一格跳）
function frame(t){
  const ss = slots(agents.length);
  agents.forEach((a, i) => {
    const el = workerEls[i];
    if (!el) return;
    const s = ss[i];
    const bob = a.state === 'working' ? Math.abs(Math.sin(t/1000*5 + s.x)) * 2 : 0;
    el.g.setAttribute('transform', `translate(${s.x} ${s.y - bob})`);
    if (a.state === 'working'){
      const arm = Math.sin(t/1000*9) * 2;
      el.armL.setAttribute('y', 6 - arm);
      el.armR.setAttribute('y', 6 + arm);
    } else {
      el.armL.setAttribute('y', 6);
      el.armR.setAttribute('y', 6);
    }
    el.st.textContent = STATE_GLYPH[a.state] || '?';
    el.st.setAttribute('fill', STATE_FILL[a.state] || '#ffe');
    // 选框：非缩放描边，任何窗口尺寸下都是 2 物理像素的锐利黄框
    let sel = el.g.querySelector('.selbox');
    if (a.id === selected && !sel){
      sel = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      sel.setAttribute('class', 'selbox');
      sel.setAttribute('x', -5.5); sel.setAttribute('y', -13.5);
      sel.setAttribute('width', 23); sel.setAttribute('height', 32);
      sel.setAttribute('fill', 'none'); sel.setAttribute('stroke', '#f7d51d');
      sel.setAttribute('stroke-width', 2);
      sel.setAttribute('vector-effect', 'non-scaling-stroke');
      el.g.insertBefore(sel, el.g.firstChild);
    } else if (a.id !== selected && sel){
      sel.remove();
    }
  });
  liveText.textContent = connected ? '● live' : '○ off';
  liveText.setAttribute('fill', connected ? '#5a5' : '#a66');
  drawBubbles();
  requestAnimationFrame(frame);
}

// 气泡：按消息 id 建节、按剩余寿命调透明度；气泡宽度量一次缓在节点上
const bubbleNodes = new Map();   // key -> {g, rect, tail, line, ts}
function drawBubbles(){
  const now = Date.now();
  messages = messages.filter(m => now - m.ts < 7000);
  const alive = new Set();
  for (const m of messages){
    const key = m.ts + '>' + m.to;
    alive.add(key);
    const pos = slotOf(m.from) || {x: 8, y: 34};
    let n = bubbleNodes.get(key);
    if (!n){
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const text = `${m.from_name}: ${m.text}`.slice(0, 26);
      g.innerHTML =
        `<text x="2" y="-17" font-size="7" fill="#111"></text>` +
        `<polygon points="3,-15 5,-15 4,-13" fill="#fff"/>`;
      const tx = g.querySelector('text');
      tx.textContent = text;
      bubblesG.appendChild(g);
      // 先填字再量宽，rect 插到字底下当底板
      const w = tx.getComputedTextLength() + 6;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', -1); rect.setAttribute('y', -26);
      rect.setAttribute('width', w); rect.setAttribute('height', 11);
      rect.setAttribute('fill', '#fff');
      g.insertBefore(rect, g.firstChild);
      // 接收者画条小箭头（端点每帧更新，工位重排时跟着走）
      let line = null;
      if (slotOf(m.to)){
        line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#7ee');
        line.setAttribute('stroke-width', 1);
        line.setAttribute('vector-effect', 'non-scaling-stroke');
        g.appendChild(line);
      }
      n = {g, rect, line, tx};
      bubbleNodes.set(key, n);
    }
    // 位置与箭头每帧刷新：工人进出导致工位重排时，气泡跟着搬家
    n.g.setAttribute('transform', `translate(${pos.x} ${pos.y})`);
    if (n.line){
      const tp = slotOf(m.to);
      n.line.setAttribute('x1', pos.x + 6); n.line.setAttribute('y1', pos.y - 26);
      n.line.setAttribute('x2', tp.x + 6);  n.line.setAttribute('y2', tp.y - 6);
    }
    const age = (now - m.ts) / 1000;
    n.g.setAttribute('opacity', age > 5.5 ? Math.max(0, (7 - age) / 1.5) : 1);
  }
  for (const [key, n] of bubbleNodes)
    if (!alive.has(key)){ n.g.remove(); bubbleNodes.delete(key); }
}
renderList();
layout();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
