<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>pixel-forge · 车间</title>
<style>
  html,body{margin:0;height:100%;background:#1a1c2c;color:#e8e8e8;
    font-family:"Courier New",ui-monospace,monospace;overflow:hidden;user-select:none}
  #app{display:flex;height:100%}
  #stage{flex:1;position:relative;min-width:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%;display:block;cursor:crosshair}
  #side{width:264px;background:#12131f;border-left:2px solid #2a2c3f;display:flex;flex-direction:column;font-size:12px}
  #hdr{padding:10px 12px;border-bottom:2px solid #2a2c3f;letter-spacing:1px;color:#f7d51d}
  #agents{flex:1 1 38%;overflow-y:auto;padding:6px}
  .agent{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:3px;cursor:pointer}
  .agent:hover{background:#1c1e30}
  .agent.sel{background:#26294a;outline:1px solid #f7d51d}
  .chip{width:12px;height:12px;border-radius:2px;flex:none}
  .aname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .astate{color:#9aa;font-size:11px}
  #chat{flex:1 1 34%;overflow-y:auto;padding:6px;border-top:2px solid #2a2c3f;line-height:1.5}
  .m{word-break:break-all}
  .m b{color:#7ee}
  #ctrl{padding:8px;border-top:2px solid #2a2c3f;display:flex;flex-direction:column;gap:6px}
  #msg{background:#0c0d17;border:1px solid #2a2c3f;color:#eee;padding:7px;border-radius:3px;font:inherit}
  #msg:focus{outline:1px solid #f7d51d}
  .btns{display:flex;gap:6px}
  button{flex:1;background:#26294a;border:1px solid #3a3d5f;color:#e8e8e8;padding:6px;border-radius:3px;
    font:inherit;cursor:pointer}
  button:hover{background:#31355c}
  #b-stop:hover{background:#5c2333}
  #status{padding:6px 10px;color:#9aa;font-size:11px;border-top:1px solid #2a2c3f}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv" width="480" height="270"></canvas></div>
  <div id="side">
    <div id="hdr">▶ pixel-forge 车间</div>
    <div id="agents"></div>
    <div id="chat"></div>
    <div id="ctrl">
      <input id="msg" placeholder="对选中 worker 说话（回车发送）"/>
      <div class="btns">
        <button id="b-send">说话</button>
        <button id="b-spawn">招工</button>
        <button id="b-stop">解雇</button>
      </div>
    </div>
    <div id="status">connecting…</div>
  </div>
</div>
<script>
'use strict';
// ── 场景模型（与 pf-scene 协议一致） ─────────────────────────────
const PROVIDER_COLORS = {
  claude_code:'#e06be0', codex:'#6be06b', gemini:'#6b9fe0',
  aider:'#e06b6b', opencode:'#e0c96b', generic:'#9aa0b0'
};
const STATE_TEXT = {
  unknown:'？', thinking:'…想', working:'⚒干', waiting_input:'⏸等', done:'✓完', error:'✗错'
};
let agents = [];          // [{id,provider,name,state,source}]
let messages = [];        // [{id,from,from_name,to,text,ts}]
let selected = null;
let connected = false;

// ── WS：同一场景协议 ───────────────────────────────────────────
let ws, retry = 1000;
function connect(){
  setStatus('connecting…');
  ws = new WebSocket(`ws://${location.host}/scene`);
  ws.onopen = () => { connected = true; retry = 1000; setStatus('connected'); };
  ws.onclose = () => { connected = false; setTimeout(connect, retry); retry = Math.min(retry*2, 8000); setStatus('reconnecting…'); };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'snapshot') agents = ev.agents;
    else if (ev.type === 'agent_upsert'){
      const i = agents.findIndex(a => a.id === ev.agent.id);
      i >= 0 ? agents[i] = ev.agent : agents.push(ev.agent);
      agents.sort((a,b) => a.id < b.id ? -1 : 1);
    }
    else if (ev.type === 'agent_gone'){
      agents = agents.filter(a => a.id !== ev.id);
      if (selected === ev.id) selected = null;
    }
    else if (ev.type === 'chat'){ ev.message.ts = Date.now(); messages.push(ev.message); trimChat(); }
    renderList();
  };
}
function setStatus(s){ document.getElementById('status').textContent = s; }
function send(cm){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(cm)); }

// ── 侧栏 ──────────────────────────────────────────────────────
function renderList(){
  const box = document.getElementById('agents');
  box.innerHTML = '';
  if (!agents.length){
    box.innerHTML = '<div style="padding:10px;color:#667">车间空无一人。<br>点「招工」或在终端里跑一个 claude。</div>';
    return;
  }
  for (const a of agents){
    const d = document.createElement('div');
    d.className = 'agent' + (a.id === selected ? ' sel' : '');
    d.innerHTML = `<span class="chip" style="background:${PROVIDER_COLORS[a.provider]||'#888'}"></span>
      <span class="aname">${a.name}</span><span class="astate">${STATE_TEXT[a.state]||a.state}</span>`;
    d.onclick = () => { selected = a.id; renderList(); };
    box.appendChild(d);
  }
}
function trimChat(){
  const box = document.getElementById('chat');
  for (const m of messages.slice(-40)){
    const d = document.createElement('div');
    d.className = 'm';
    d.innerHTML = `<b>${esc(m.from_name)}</b>→${esc(m.to==='human'?'你':m.to)}: ${esc(m.text)}`;
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 40) box.removeChild(box.firstChild);
}
function esc(s){ const d=document.createElement('span'); d.textContent=s??''; return d.innerHTML; }

// ── 控制 ──────────────────────────────────────────────────────
async function api(method, path, body){
  const r = await fetch(path, {method, headers:{'content-type':'application/json'},
    body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}
async function speak(){
  const el = document.getElementById('msg');
  const text = el.value.trim();
  if (!text) return;
  if (!selected){ setStatus('先在列表或画布上选中一只 worker'); return; }
  try {
    // 走邮局：能注入的直接注入，不能的进收件箱；同时气泡上墙
    await api('POST', '/msg', {from_pid: null, to: selected, text});
    el.value = '';
  } catch(e){ setStatus('发送失败：' + e.message); }
}
document.getElementById('b-send').onclick = speak;
document.getElementById('msg').addEventListener('keydown', e => { if (e.key==='Enter') speak(); });
document.getElementById('b-spawn').onclick = () =>
  api('POST', '/agents', {provider:'claude_code'}).catch(e => setStatus('招工失败：'+e.message));
document.getElementById('b-stop').onclick = () => {
  if (!selected) return setStatus('先选中要解雇的 worker');
  api('DELETE', '/agents/' + selected).catch(e => setStatus('解雇失败：'+e.message));
};

// ── 像素画布（480x270 低分辨率 + CSS 放大 = 像素感） ──────────────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let hover = null;
cv.addEventListener('click', e => {
  const p = mouseToScene(e);
  const a = hitWorker(p);
  selected = a ? a.id : selected;
  renderList();
});
cv.addEventListener('mousemove', e => { hover = hitWorker(mouseToScene(e)); });
function mouseToScene(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * cv.width,
           y: (e.clientY - r.top) / r.height * cv.height };
}
// 工位布局：车间地板网格上自动排位
function slots(n){
  const out = [];
  const cols = 6, x0 = 34, y0 = 56, dx = 72, dy = 56;
  for (let i = 0; i < n; i++) out.push({x: x0 + (i%cols)*dx, y: y0 + Math.floor(i/cols)*dy});
  return out;
}
function hitWorker(p){
  const ss = slots(agents.length);
  for (let i = 0; i < agents.length; i++){
    const s = ss[i];
    if (p.x >= s.x-6 && p.x <= s.x+18 && p.y >= s.y-14 && p.y <= s.y+18) return agents[i];
  }
  return null;
}
function draw(t){
  // 地板：棋盘格
  for (let y = 0; y < cv.height; y += 16)
    for (let x = 0; x < cv.width; x += 16)
      ctx.fillStyle = ((x+y)/16) % 2 ? '#20223a' : '#1e2035',
      ctx.fillRect(x, y, 16, 16);
  // 背景墙 & 灯
  ctx.fillStyle = '#171928'; ctx.fillRect(0, 0, cv.width, 30);
  ctx.fillStyle = '#f7d51d'; ctx.font = '9px monospace';
  ctx.fillText('PIXEL-FORGE WORKSHOP', 8, 13);
  ctx.fillStyle = '#5a5'; ctx.fillText(connected ? '● live' : '○ off', cv.width-46, 13);

  const ss = slots(agents.length);
  agents.forEach((a, i) => drawWorker(ss[i].x, ss[i].y, a, t, a.id === selected));
  drawBubbles(t);
  requestAnimationFrame(draw);
}
function drawWorker(x, y, a, t, sel){
  const c = PROVIDER_COLORS[a.provider] || '#9aa0b0';
  const bob = a.state === 'working' ? Math.round(Math.abs(Math.sin(t*5 + x)) * 2) : 0;
  const yy = y - bob;
  if (sel){ ctx.strokeStyle = '#f7d51d'; ctx.lineWidth = 1; ctx.strokeRect(x-5.5, y-13.5, 23, 32); }
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x+1, y+15, 11, 2);
  // 腿
  ctx.fillStyle = '#3a3d5f'; ctx.fillRect(x+3, yy+11, 3, 4); ctx.fillRect(x+7, yy+11, 3, 4);
  // 身体（工装）
  ctx.fillStyle = c; ctx.fillRect(x+2, yy+5, 9, 7);
  // 手臂：干活时上下挥
  const arm = a.state === 'working' ? Math.round(Math.sin(t*9)*2) : 0;
  ctx.fillRect(x, yy+6-arm, 2, 5); ctx.fillRect(x+11, yy+6+arm, 2, 5);
  // 头 + 安全帽
  ctx.fillStyle = '#f0c8a0'; ctx.fillRect(x+3, yy, 7, 5);
  ctx.fillStyle = c; ctx.fillRect(x+2, yy-2, 9, 2); ctx.fillRect(x+5, yy-4, 4, 2);
  // 眼睛
  ctx.fillStyle = '#222'; ctx.fillRect(x+4, yy+2, 1, 1); ctx.fillRect(x+8, yy+2, 1, 1);
  // 名牌
  ctx.fillStyle = '#cfd3ff'; ctx.font = '7px monospace';
  ctx.fillText(a.name.slice(0, 9), x - 2, y + 24);
  // 状态气泡
  const s = {working:'!', thinking:'...', waiting_input:'zZ', done:'OK', error:'X!', unknown:'?'}[a.state] || '?';
  ctx.fillStyle = {error:'#ff6b6b', done:'#6bff8f'}[a.state] || '#ffe';
  ctx.fillText(s, x + 13, yy - 2);
}
function drawBubbles(t){
  const now = Date.now();
  messages = messages.filter(m => now - m.ts < 7000);
  for (const m of messages){
    const from = agents.find(a => a.id === m.from);
    const to = agents.find(a => a.id === m.to);
    // 气泡挂在发送者头上（human 的挂在左上角）
    const pos = from ? slots(agents.length)[agents.indexOf(from)] : {x: 8, y: 34};
    const age = (now - m.ts) / 1000;
    ctx.globalAlpha = age > 5.5 ? Math.max(0, (7 - age) / 1.5) : 1;
    const text = `${m.from_name}: ${m.text}`.slice(0, 26);
    ctx.font = '7px monospace';
    const w = ctx.measureText(text).width + 6;
    ctx.fillStyle = '#fff'; ctx.fillRect(pos.x - 1, pos.y - 26, w, 11);
    ctx.fillStyle = '#fff'; ctx.fillRect(pos.x + 3, pos.y - 15, 2, 2);
    ctx.fillStyle = '#111'; ctx.fillText(text, pos.x + 2, pos.y - 18);
    if (to){ // 接收者画个小箭头提示
      const tp = slots(agents.length)[agents.indexOf(to)];
      if (tp){ ctx.strokeStyle = '#7ee'; ctx.beginPath();
        ctx.moveTo(pos.x + 6, pos.y - 26); ctx.lineTo(tp.x + 6, tp.y - 6); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
  }
}
renderList();
connect();
requestAnimationFrame(draw);
</script>
</body>
</html>
